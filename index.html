<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    header {
      height: 120px;
      display: grid;
      grid-template-columns: 1fr repeat(5, 1fr);
      align-items: start;
      padding: 50px 70px;
      font-size: 28px;
      font-weight: bold;
    }

    main {
      min-height: calc(100vh - 240px);
    }

    .title {
      text-align: center;
      font-size: 60px;
      font-weight: bold;
      margin: 80px 0 120px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 175px;
      padding: 0 55px;
    }

    .box {
      height: 425px;
      background: red;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 60px;
      font-weight: bold;
    }

    footer {
      height: 120px;
      display: grid;
      grid-template-columns: 1fr repeat(5, 1fr);
      align-items: center;
      padding: 30px 90px;
      font-size: 28px;
      font-weight: bold;
    }

    @media (max-width: 900px) {
      header,
      footer {
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding: 30px;
      }

      .title {
        font-size: 40px;
        margin: 50px 0;
      }

      .content {
        grid-template-columns: 1fr;
        gap: 40px;
        padding: 0 30px;
      }

      .box {
        height: 300px;
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div>Logo</div>
    <div>navbar</div>
    <div>navbar</div>
    <div>navbar</div>
    <div>navbar</div>
    <div>navbar</div>
  </header>

  <main>
    <h1 class="title">1-Section</h1>

    <section class="content">
      <div class="box">Left</div>
      <div class="box">Right</div>
    </section>
  </main>

  <footer>
    <div>Logo</div>
    <div>footer</div>
    <div>footer</div>
    <div>footer</div>
    <div>footer</div>
    <div>footer</div>
  </footer>

</body>
</html>
